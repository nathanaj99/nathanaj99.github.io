# ---------------------------------------------------------------------------
# Publications. Migrated from _bibliography/papers.bib (al-folio + jekyll-scholar).
#
# One entry per paper. Ordering on the site is computed, not manual:
#   year (desc) → type (working papers, then conference, then journal) → month (desc)
#
# Fields:
#   id          unique slug, used for anchors and theme links
#   type        working-paper | conference | journal
#   venue       full venue name; venueShort is used in narrow columns
#   status      free text, e.g. "Working paper", "Forthcoming"
#   links       arxiv (id only) / pdf / html / code — omit what does not exist
#   figure      file in public/figures, revealed on hover on /research
#   selected    true → can appear as representative work on the homepage; the
#               two newest selected papers of each strand are shown there
#   themes      one id from research.yaml — the strand this paper belongs to
# ---------------------------------------------------------------------------

